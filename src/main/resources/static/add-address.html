<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Add Delivery Address
</title>


<link rel="stylesheet"
href="css/add-address.css">


</head>
<script src="/js/auth.js"></script>

<body>


<div class="address-container">


<div class="address-card">


<h2>
Add Delivery Address
</h2>



<input 
id="name"
placeholder="Full Name">



<input
id="mobile"
placeholder="Mobile Number">



<input
id="houseNo"
placeholder="House No">



<input
id="street"
placeholder="Street / Area">



<input
id="city"
placeholder="City">



<input
id="state"
placeholder="State">



<input
id="pincode"
placeholder="Pincode">





<button onclick="saveAddress()">

Save Address

</button>



<button 
class="back"
onclick="goBack()">

Cancel

</button>



</div>


</div>



<script src="js/add-address.js"></script>


</body>

</html>
