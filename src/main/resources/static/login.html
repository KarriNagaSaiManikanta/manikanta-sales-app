<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Manikanta Sales</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

</head>

<body>

<!-- ==========================
        LOGIN SECTION
=========================== -->

<section class="login-page">

    <div class="container">

        <div class="login-card">

            <!-- LEFT -->

            <div class="login-left">

                <h1>

                    Welcome Back

                </h1>

                <p>

                    Login to continue shopping at
                    <strong>Manikanta Sales</strong>

                </p>

                <img src="images/login.png"
                     alt="Login">

            </div>

            <!-- RIGHT -->

            <div class="login-right">

                <h2>

                    Login

                </h2>

                <form id="loginForm">

                    <!-- EMAIL -->

                    <div class="input-group">

                        <label>

                            Email Address

                        </label>

                        <input

                                type="email"

                                id="email"

                                placeholder="Enter Email"

                                required>

                    </div>

                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label>

                            Password

                        </label>

                        <div class="password-box">

                            <input

                                    type="password"

                                    id="password"

                                    placeholder="Enter Password"

                                    required>

                           

                            </span>

                        </div>

                    </div>

                    <!-- OPTIONS -->

                    <div class="login-options">

                        <label>

                            <input

                                    type="checkbox"

                                    id="remember">

                            Remember Me

                        </label>

                        <a href="forgot-password.html">

                            Forgot Password?

                        </a>

                    </div>

                    <!-- ERROR -->

                    <p

                            id="loginMessage"

                            class="error-message">

                    </p>

                    <!-- BUTTON -->

                    <button

                            type="submit"

                            class="btn btn-primary login-btn"

                            id="loginBtn">

                        Login

                    </button>

                </form>

                <!-- REGISTER -->

                <div class="register-link">

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

<script src="js/api.js"></script>

<script src="js/login.js"></script>

</body>

</html>
