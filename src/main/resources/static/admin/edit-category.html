<!-- ========================= -->
<!-- MAIN -->
<!-- ========================= -->


<main class="main-content">





<header class="top-navbar">


<div>


<h2>
Edit Category
</h2>


<p>
Update Category Details
</p>


</div>





<div class="admin-info">


<span class="material-icons">
account_circle
</span>


<span id="adminEmail"></span>



</div>



</header>









<div class="form-container">





<h2>
Edit Category
</h2>






<form id="editCategoryForm">





<div class="form-group">


<label>
Category Name
</label>


<input

type="text"

id="name"

placeholder="Enter Category Name"

required>


</div>









<div class="form-group">


<label>
Description
</label>



<textarea

id="description"

rows="5"

placeholder="Enter Description">

</textarea>


</div>









<div class="form-group">


<label>
Category Image
</label>



<input

type="file"

id="image"

accept="image/*"

onchange="previewImage(event)">


</div>









<div class="image-preview">


<img

id="preview"

src="../images/no-image.png"

alt="Category Image"

width="150"

height="150"

style="
object-fit:cover;
border-radius:10px;
margin-top:15px;
">


</div>









<div class="form-group">


<label>
Status
</label>



<div class="checkbox-group">


<input

type="checkbox"

id="active"

checked>



<label for="active">

Active

</label>



</div>



</div>









<div class="form-buttons">


<button

type="button"

class="btn-secondary"

onclick="history.back()">

Cancel

</button>







<button

type="submit"

class="btn-primary">


Update Category


</button>



</div>







</form>






</div>







</main>



</div>
