<main class="main-content">



<div class="page-header">


<div>

<h2>
Add Category
</h2>


<p>
Create a New Product Category
</p>


</div>


</div>









<div class="form-container">


<form id="categoryForm">





<div class="form-grid">





<!-- NAME -->


<div class="form-group">


<label>
Category Name
</label>


<input

type="text"

id="name"

placeholder="Enter Category Name"

required>


</div>








<!-- IMAGE UPLOAD -->


<div class="form-group">


<label>
Category Image
</label>



<input

type="file"

id="image"

accept="image/*"

onchange="previewImage(event)"

required>



<img

id="preview"

src=""

width="150"

height="150"

style="
display:none;
margin-top:15px;
object-fit:cover;
border-radius:10px;
">


</div>









<!-- DESCRIPTION -->


<div class="form-group full-width">


<label>
Description
</label>



<textarea

id="description"

placeholder="Category Description">

</textarea>


</div>








<!-- STATUS -->


<div class="form-group full-width">


<div class="checkbox-group">


<input

type="checkbox"

id="active"

checked>



<label for="active">

Active

</label>


</div>


</div>





</div>









<div class="form-buttons">



<button

type="button"

class="btn-cancel"

onclick="history.back()">

Cancel

</button>






<button

type="submit"

class="btn-save">

Save Category

</button>



</div>







<p id="message"></p>



</form>


</div>
