<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Manikanta Sales</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

</head>

<body>

<section class="login-page">

    <div class="container">

        <div class="login-card">

            <!-- LEFT -->

            <div class="login-left">

                <h1>Reset Password</h1>

                <p>

                    Enter the OTP sent to your registered email
                    and create a new secure password.

                </p>

                <img src="images/reset-password.png"
                     alt="Reset Password">

            </div>

            <!-- RIGHT -->

            <div class="login-right">

                <h2>Create New Password</h2>

                <form id="resetPasswordForm">

                    <!-- EMAIL -->

                    <div class="input-group">

                        <label>Email</label>

                        <input
                                type="email"
                                id="email"
                                readonly>

                    </div>

                    <!-- OTP -->

                    <div class="input-group">

                        <label>OTP</label>

                        <input
                                type="text"
                                id="otp"
                                maxlength="6"
                                placeholder="Enter OTP"
                                required>

                    </div>

                    <!-- NEW PASSWORD -->

                    <div class="input-group">

                        <label>New Password</label>

                        <div class="password-box">

                            <input
                                    type="password"
                                    id="newPassword"
                                    placeholder="Enter New Password"
                                    required>

                            <span
                                    class="material-icons toggle-password"
                                    id="toggleNewPassword">

                                visibility

                            </span>

                        </div>

                    </div>

                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label>Confirm Password</label>

                        <div class="password-box">

                            <input
                                    type="password"
                                    id="confirmPassword"
                                    placeholder="Confirm Password"
                                    required>

                            <span
                                    class="material-icons toggle-password"
                                    id="toggleConfirmPassword">

                                visibility

                            </span>

                        </div>

                    </div>

                    <!-- MESSAGE -->

                    <p id="resetMessage"
                       class="error-message"></p>

                    <!-- BUTTON -->

                    <button
                            type="submit"
                            id="resetBtn"
                            class="btn btn-primary login-btn">

                        Update Password

                    </button>

                </form>

                <div class="register-link">

                    Back to

                    <a href="login.html">

                        Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

<script src="js/api.js"></script>

<script src="js/reset-password.js"></script>

</body>

</html>
