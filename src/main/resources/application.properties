spring.application.name=manikantasales

server.port=8080


# ======================
# MYSQL DATABASE
# ======================

spring.datasource.url=jdbc:mysql://localhost:3306/manikanta_sales_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================
# JPA
# ======================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ======================
# MAIL OTP
# ======================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true



# ======================
# JWT
# ======================

jwt.secret=MySuperSecretKeyForJwtAuthentication2026MySuperSecretKey12345

jwt.expiration=86400000
# =========================
# IMAGE UPLOAD
# =========================

file.category-dir=uploads/categories
file.product-dir=uploads/products


spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB