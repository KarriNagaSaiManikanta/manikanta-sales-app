spring.application.name=manikantasales
server.port=${PORT:8080}

# ======================
# MYSQL DATABASE (Render / Aiven)
# ======================
spring.datasource.url=jdbc:mysql://mysql-3734f74a-karri2548-a248.f.aivencloud.com:20446/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======================
# JPA / HIBERNATE
# ======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ======================
# MAIL OTP (Secured)
# ======================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

spring.mail.properties.mail.debug=true

# ======================
# JWT
# ======================
jwt.secret=MySuperSecretKeyForJwtAuthentication2026MySuperSecretKey12345
jwt.expiration=86400000

# =========================
# IMAGE UPLOAD (Local paths kept for safety)
# =========================
file.category-dir=uploads/categories
file.product-dir=uploads/products

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
